[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vexillum"
version = "0.0.1"
description = "Reserved for the Vexillum standard: agent pipelines that live in the repository."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["vexillum", "agents", "pipeline", "continuous-delegation", "ai"]

[project.urls]
Homepage = "https://vexillum.io"
Specification = "https://github.com/vexillum-spec/spec"
Repository = "https://github.com/vexillum-spec/vexillum"

[tool.setuptools]
packages = ["vexillum"]
